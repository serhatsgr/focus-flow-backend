# ─── AI COACH CONFIGURATION ──────────────────────────────────────────────────
# Desteklenen API'ler (OpenAI chat/completions formatı):
#   DeepSeek : https://api.deepseek.com/chat/completions          (model: deepseek-chat)
#   OpenAI   : https://api.openai.com/v1/chat/completions         (model: gpt-4o-mini)
#   Gemini   : https://generativelanguage.googleapis.com/v1beta/openai/ (model: gemini-2.0-flash)
#
# GÜVENLİK: api-key'i bu dosyaya YAZMAYIN.
# Bunun yerine environment variable kullanın:
#   Windows: setx AI_COACH_API_KEY "sk-..."
#   Linux  : export AI_COACH_API_KEY=sk-...
# Ya da application-local.properties (git ignore'da) dosyasına yazın.
